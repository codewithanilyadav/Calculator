<!DOCTYPE html>
<html lang="en">
    <head>
        <meta name="viewport" content="width-device-wdith" initial-scale="1.0">
        <meta charset="UTF-8">
        <title>Calculator</title>
        <link rel="stylesheet" href="style.css">
        
    </head>
    <body>
        <div class="Container">
            <input type="text" placeholder="0" id="inputBox">
            <div>
                <button class="oper">OFF</button>
                <button class="oper">DEL</button>
                <button class="oper">%</button>
                <button class="oper">AC</button>
            </div>
            <div>
                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button class="oper">/</button>
            </div>
            <div>
                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button class="oper">*</button>
            </div>
            <div>
                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button class="oper">-</button>
            </div>
            <div> 
                <button>0</button>
                <button>.</button>
                <button class="oper">+</button>
                <button class="equalbtn">=</button>
            </div>
            <script src="script.js"></script>

        </div>
    </body>
</html>
